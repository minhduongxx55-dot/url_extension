openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: URL entry storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all entries
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by keyword, code, or url
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a new entry manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/search:
    get:
      operationId: searchEntry
      tags: [entries]
      summary: Search entry by keyword or code to get URL (used by extension)
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matched entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/validate-and-add:
    post:
      operationId: validateAndAddEntry
      tags: [entries]
      summary: Validate URL accessibility then add to storage (used by extension after AI extraction)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateAndAddInput"
      responses:
        "201":
          description: Entry added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "200":
          description: Entry already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "422":
          description: URL not accessible (validation failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntryInput"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Entry:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          nullable: true
        keyword:
          type: string
          nullable: true
        url:
          type: string
        isValid:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - url
        - isValid
        - createdAt
        - updatedAt

    CreateEntryInput:
      type: object
      properties:
        code:
          type: string
          nullable: true
        keyword:
          type: string
          nullable: true
        url:
          type: string
        isValid:
          type: boolean
      required:
        - url

    UpdateEntryInput:
      type: object
      properties:
        code:
          type: string
          nullable: true
        keyword:
          type: string
          nullable: true
        url:
          type: string
        isValid:
          type: boolean

    ValidateAndAddInput:
      type: object
      properties:
        url:
          type: string
        keyword:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      required:
        - url

    SearchResult:
      type: object
      properties:
        entry:
          $ref: "#/components/schemas/Entry"
        source:
          type: string
          description: "cache or ai"
      required:
        - entry
        - source

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
